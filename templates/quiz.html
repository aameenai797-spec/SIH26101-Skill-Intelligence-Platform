{% extends "base.html" %}{% block content %}<p class="eyebrow">KNOWLEDGE CHECK</p><h1>{{ quiz.title }}</h1><form method="post">{% for q in questions %}{% set qi=loop.index0 %}<section class="panel question"><h3>Question {{ loop.index }}</h3><p>{{ q.question }}</p>{% for option in q.options %}<label class="option"><input type="radio" name="q{{ qi }}" value="{{ loop.index0 }}" required> {{ option }}</label>{% endfor %}</section>{% endfor %}<button class="btn">Submit answers</button></form>{% endblock %}
